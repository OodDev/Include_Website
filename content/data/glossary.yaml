# Definitions derived only from the source documents (§6.10/§9.4).
# Behind features.showGlossary until owner approval.
- term: Cooperation Partnership
  definition: An Erasmus+ format for transnational cooperation in vocational education and training (KA220-VET). INCLUDE is one of these partnerships.
- term: ESCO
  definition: The multilingual European classification of skills, competences and occupations used to map vocational profiles to real labour-market frameworks.
- term: Micro-credential
  definition: A small, verifiable record of the competences a person has acquired, designed to be recognised by employers.
- term: Technical Passport
  definition: A project tool that documents the competences acquired during the vocational pathway and makes them understandable and transferable to employers.
- term: Protected Gym
  definition: A supportive community-based environment, such as a library, museum, cultural institution or community organisation, where participants develop vocational competences, confidence and work habits.
- term: Pre-corporate preparation
  definition: The phase in which the pathway moves progressively closer to real company conditions, connecting tasks and competences to the workflows of participating SMEs.
- term: Open market
  definition: The final phase with real workplace experiences in SMEs, supported by company tutors or buddies and educational mentors.
- term: Corporate Inclusion Readiness Index
  definition: A diagnostic framework to explore company culture, workflow adaptability, mentoring capacity and perceived risks related to inclusive work-based learning.
- term: Ready for Inclusion
  definition: The INCLUDE initiative that helps companies understand their readiness, strengthen inclusive practices and make their commitment visible, with a framework and label.
