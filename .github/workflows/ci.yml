name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SITE_ENV: preview
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

concurrency:
  # One run per ref; a rapid series of pushes to main supersedes the older
  # queued runs instead of running full e2e for every commit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard — client PDFs never enter the repository
        run: |
          if [ -n "$(git ls-files '*.pdf')" ]; then
            echo "Found client PDFs tracked in the repo (AGENTS.md forbids this):"
            git ls-files '*.pdf'
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Content checks
        run: pnpm check:content
      - name: i18n checks
        run: pnpm check:i18n
      - name: Placeholder checks
        run: pnpm check:placeholders
      - name: Schema.org checks
        run: pnpm check:schema
      - name: Unit + integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Audit (non-blocking notes)
        run: pnpm audit --audit-level high || true

  e2e:
    # ubuntu-latest moved to Ubuntu 26 in October 2026; the fresh image has
    # been intermittently failing DNS resolution for the apt mirrors that
    # `playwright install --with-deps` needs. Pin to the mature 24.04 image.
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium (retry transient apt/DNS failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 30s…"
            sleep 30
          done
          echo "Chromium install failed after 3 attempts."
          exit 1
      - name: E2E (EN + IT, desktop + mobile)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
