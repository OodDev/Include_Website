name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  launch-gate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # NOT part of ordinary CI (§17): fails while legal drafts are unapproved,
      # owner inputs unresolved or fake data remains.
      - name: check:launch
        run: pnpm check:launch

  docker:
    runs-on: ubuntu-latest
    needs: launch-gate
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t include-website:${{ github.sha }} .

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    environment: production
    steps:
      - uses: actions/checkout@v4
      # Owner-approved deployment target only. Vercel: EU region (fra1) via
      # vercel.json; npm i -g vercel && vercel deploy --prod. Never assume a
      # host the owner has not approved (§20).
      - name: Deploy (documented manual step)
        run: |
          echo "Deploy is executed by the release captain following"
          echo "docs/deployment-runbook.md — no host is assumed in CI."
